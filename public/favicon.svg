<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <!-- Dark background gradient matching website (#0b080c) -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#150d22"/>
      <stop offset="50%" stop-color="#0b080c"/>
      <stop offset="100%" stop-color="#07040a"/>
    </linearGradient>

    <!-- Dark purple border gradient -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c084fc" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#7c3aed" stop-opacity="0.3"/>
    </linearGradient>

    <!-- Center ambient radial glow -->
    <radialGradient id="centerGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#a855f7" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0"/>
    </radialGradient>

    <!-- Text gradient matching website theme -->
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f3e8ff"/>
      <stop offset="45%" stop-color="#c084fc"/>
      <stop offset="100%" stop-color="#9333ea"/>
    </linearGradient>

    <!-- Subtle drop shadow for depth -->
    <filter id="subtleGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#7c3aed" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Dark Rounded Squircle Tile -->
  <rect x="3" y="3" width="94" height="94" rx="22" ry="22" fill="url(#bgGrad)" stroke="url(#borderGrad)" stroke-width="2.5"/>

  <!-- Ambient Glow -->
  <circle cx="50" cy="50" r="32" fill="url(#centerGlow)"/>

  <!-- BS Monogram Letters -->
  <text x="50" y="68" font-family="-apple-system, BlinkMacSystemFont, 'Geist', 'Inter', 'Montserrat', 'Arial Black', sans-serif" font-size="52" font-weight="900" letter-spacing="-0.5" fill="url(#textGrad)" filter="url(#subtleGlow)" text-anchor="middle">BS</text>
</svg>